name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Migrasi, trigger & RLS (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kosku_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/kosku_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Shim Supabase (auth schema & roles)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/db/supabase-shim.sql
      - run: pnpm db:migrate
      - name: Skema sinkron dengan migrasi
        run: |
          pnpm drizzle-kit generate --name ci-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts berubah tanpa migrasi. Jalankan pnpm db:generate."
            git status --porcelain drizzle
            exit 1
          fi
      - run: pnpm test:db
      - name: Seed data contoh
        run: |
          psql "$DATABASE_URL" -c "insert into auth.users (email) values ('owner@ci.local')"
          SEED_OWNER_EMAIL=owner@ci.local pnpm db:seed
